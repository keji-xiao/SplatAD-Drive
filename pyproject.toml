[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splatad-drive"
version = "0.1.0"
description = "Auditable camera/LiDAR SplatAD scene editing and evaluation"
requires-python = ">=3.10"
dependencies = ["torch>=2.0", "numpy>=1.24", "Pillow>=9", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]
metrics = ["scipy>=1.10", "lpips>=0.1.4"]

[project.scripts]
splatad-drive = "splatad_drive.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["cuda: requires CUDA and the custom SplatAD gsplat extension", "upstream: requires the official NeuRAD environment and real data"]
